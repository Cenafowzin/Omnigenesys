[workspace]
members = ["crates/omnigenesys-core", "crates/omnigenesys-wasm", "bins/mapgen"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Rodrigo Dubeux <digodubeux@gmail.com>"]
repository = "https://github.com/Cenafowzin/Omnigenesys"

[profile.release]
codegen-units = 1

# The browser build. opt-level 3, not "s": island 1024² in V8, 3 alternating
# rounds of 15 (2026-10-24), 34 ms against 47 for a binary 5% larger
# (931 against 887 KB). LTO across the core; a panic aborts anyway on wasm.
# Built by crates/omnigenesys-wasm/build.sh.
[profile.wasm-release]
inherits = "release"
lto = true
panic = "abort"
