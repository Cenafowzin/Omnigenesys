[package]
name = "omnigenesys-mapgen"
description = "Command-line map generator for Omnigenesys pipelines"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "mapgen"
path = "src/main.rs"

[dependencies]
omnigenesys_core = { path = "../../crates/omnigenesys-core" }
# env: --salt can come from OMNIGENESYS_SALT, so it stays out of shell history.
clap = { version = "4.6", features = ["derive", "env"] }
# Preview: png directly (the image crate pulls in more even with no features).
png = "0.18"
serde_json = "1"

[dev-dependencies]
png = "0.18"
