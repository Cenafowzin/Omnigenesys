[package]
name = "omnigenesys_core"
description = "Engine-agnostic procedural map generation — grid, pipeline, operators and conditions"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# Add dependencies as each module needs them, not upfront.
# Coming later: rand + rand_chacha + sha2 (rng), insta (golden snapshots).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
indexmap = "2"
thiserror = "2"
