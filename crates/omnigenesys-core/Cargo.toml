[package]
name = "omnigenesys_core"
description = "Engine-agnostic procedural map generation — grid, pipeline, operators and conditions"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# Add dependencies as each module needs them, not upfront.

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: params and other maps keep the order they were written in.
serde_json = { version = "1", features = ["preserve_order"] }
schemars = "1"
indexmap = "2"
thiserror = "2"
serde_path_to_error = "0.1"
# spec: strict JSON with the position of every value (all extensions off).
jsonc-parser = { version = "0.34", default-features = false }
# export: integers to text without going through fmt (already a serde_json dependency).
itoa = "1"
# rng: frozen contract (PLANNING §2.1). The golden vectors in tests/rng_contract.rs
# guard every version bump of these.
chacha20 = { version = "0.10.2", default-features = false, features = ["rng"] }
rand_core = "0.10"
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
# Golden map snapshots in tests/snapshots.rs; review changes with `cargo insta review`.
insta = "1.49"
jsonschema = { version = "0.59", default-features = false }
